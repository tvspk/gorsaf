<title>Poslech Gorsaf Abercastell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: sticky control bar (filters + player) over one long list of clips, one row per clip. Station-signal palette: line green, signal red for flagged. */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --fg:#1b2420; --muted:#5d6b64; --line:#d9e0db;
  --accent:#1f6b52; --accent-fg:#ffffff; --flag:#c0262d; --flag-bg:#fbe9e8; --heard:#8a9a92; --now:#e3f1ea;
  --display:"Fraunces",Georgia,serif; --body:"Atkinson Hyperlegible",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121815; --surface:#19211d; --fg:#e4ebe6; --muted:#9aaba2; --line:#2b3631;
  --accent:#5cc49b; --accent-fg:#0d1a14; --flag:#ff6b6b; --flag-bg:#3a1c1d; --heard:#6f8178; --now:#1f3a2e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --surface:#19211d; --fg:#e4ebe6; --muted:#9aaba2; --line:#2b3631;
  --accent:#5cc49b; --accent-fg:#0d1a14; --flag:#ff6b6b; --flag-bg:#3a1c1d; --heard:#6f8178; --now:#1f3a2e; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--body)}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px;padding-block:20px 80px}
h1{font:600 1.6rem/1.15 var(--display);margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 16px;max-width:62ch}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.row1,.row2{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input[type=search],button{font:inherit;font-size:.95rem;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
input[type=search]{flex:1 1 180px;min-width:0}
button{cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg)}
.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
.stat{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums;margin-left:auto}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:.9rem;color:var(--muted)}
ol{list-style:none;margin:8px 0 0;padding:0}
li.clip{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:10px 6px;border-bottom:1px solid var(--line)}
li.clip.now{background:var(--now)}
li.clip.flagged{background:var(--flag-bg)}
.play{width:40px;height:40px;border-radius:50%;padding:0;display:grid;place-items:center;font-size:1rem}
.txt{min-width:0}
.cy{font-size:1.05rem;overflow-wrap:anywhere}
li.heard:not(.now) .cy{color:var(--heard)}
.meta{font:12px/1.4 var(--mono);color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.tag{display:inline-block;padding:0 6px;border-radius:4px;border:1px solid var(--line);margin-right:6px;font-family:var(--body)}
.flagbtn{font-size:.85rem;white-space:nowrap}
li.flagged .flagbtn{background:var(--flag);border-color:var(--flag);color:#fff}
.note{grid-column:2 / 4;display:flex;gap:8px}
.note input{flex:1;min-width:0;font:inherit;font-size:.9rem;padding:6px 8px;border:1px solid var(--flag);border-radius:6px;background:var(--surface);color:var(--fg)}
.msg{color:var(--muted);font-size:.85rem}
.empty{padding:24px 6px;color:var(--muted)}
@media (max-width:520px){.stat{margin-left:0;width:100%}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<div class="wrap">
  <h1>Poslech nahrávek</h1>
  <p class="sub">Všech 3130 nahrávek ze hry. Když něco nezní dobře, klikni na <b>Nahlásit</b> a případně připiš, co je špatně. Nahlášené nahrávky si pak Claude přečte a připraví nové pokusy.</p>
  <div class="bar">
    <div class="row1">
      <select id="unit" aria-label="Lekce"></select>
      <div class="seg" role="group" aria-label="Druh">
        <button data-k="all" aria-pressed="true">Vše</button><button data-k="p" aria-pressed="false">Případy</button><button data-k="n" aria-pressed="false">Zpravodaj</button><button data-k="k" aria-pressed="false">Kartičky</button>
      </div>
      <input type="search" id="q" placeholder="Hledat ve velštině…" aria-label="Hledat">
    </div>
    <div class="row2">
      <button class="primary" id="auto">▶ Přehrávat postupně</button>
      <button id="stop">■ Stop</button>
      <label class="chk"><input type="checkbox" id="onlyFlag"> jen nahlášené</label>
      <label class="chk"><input type="checkbox" id="hideHeard"> skrýt poslechnuté</label>
      <span class="stat" id="stat"></span>
    </div>
    <div class="msg" id="msg" hidden></div>
  </div>
  <ol id="list"></ol>
</div>

<script type="application/json" id="data">__ROWS__</script>
<script>
const ROWS=JSON.parse(document.getElementById('data').textContent).map(r=>({key:r[0],text:r[1],where:r[2],unit:r[3],voice:r[5],pack:r[6],off:r[7],len:r[8],
  kind:r[6][0]==='k'?'k':(/^n\d+$/.test(r[2])?'n':'p')}));
const KIND={p:'případ',n:'zpravodaj',k:'kartička'};
const $=id=>document.getElementById(id);
let heard=new Set(); try{heard=new Set(JSON.parse(localStorage.getItem('heard')||'[]'))}catch(e){}
const saveHeard=()=>{try{localStorage.setItem('heard',JSON.stringify([...heard]))}catch(e){}};
let flags={}, db=null, kindF='all', view=[], cur=-1, auto=false;

// unit select
const units=[...new Set(ROWS.map(r=>r.unit))].sort((a,b)=>a-b);
$('unit').innerHTML='<option value="0">Všechny lekce</option>'+units.map(u=>`<option value="${u}">Lekce ${u}</option>`).join('');
$('unit').value='1';

// audio: one fetch per pack, sliced into blobs
const packs={}, urls={};
async function urlFor(r){
  if(urls[r.key])return urls[r.key];
  packs[r.pack]=packs[r.pack]||fetch('audio/'+r.pack+'.mp3').then(x=>{if(!x.ok)throw new Error(x.status);return x.arrayBuffer()});
  const buf=await packs[r.pack];
  return urls[r.key]=URL.createObjectURL(new Blob([buf.slice(r.off,r.off+r.len)],{type:'audio/mpeg'}));
}
const player=new Audio();
player.addEventListener('ended',()=>{ if(auto) next(); else setNow(-1) });
async function play(i){
  const r=view[i]; if(!r)return;
  setNow(i);
  try{ player.src=await urlFor(r); await player.play(); heard.add(r.key); saveHeard(); markHeard(r.key) }
  catch(e){ say('Nahrávku se nepodařilo přehrát ('+e.message+').'); auto=false }
}
function next(){ if(cur+1<view.length) play(cur+1); else { auto=false; setNow(-1); say('Konec seznamu.') } }
function setNow(i){
  document.querySelectorAll('li.now').forEach(li=>li.classList.remove('now'));
  cur=i; const li=$('list').children[i];
  if(li){ li.classList.add('now'); li.scrollIntoView({block:'center',behavior:'smooth'}) }
}
function say(t){ $('msg').textContent=t; $('msg').hidden=!t }
function markHeard(k){ const li=document.querySelector(`li[data-key="${k}"]`); if(li) li.classList.add('heard'); stat() }

function filter(){
  const u=+$('unit').value, q=$('q').value.trim().toLowerCase(), of=$('onlyFlag').checked, hh=$('hideHeard').checked;
  return ROWS.filter(r=>(!u||r.unit===u)&&(kindF==='all'||r.kind===kindF)&&(!q||r.text.toLowerCase().includes(q))&&(!of||flags[r.key])&&(!hh||!heard.has(r.key)));
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function rowHTML(r,i){
  const f=flags[r.key];
  return `<li class="clip${f?' flagged':''}${heard.has(r.key)?' heard':''}" data-key="${r.key}" data-i="${i}">
    <button class="play" aria-label="Přehrát">▶</button>
    <div class="txt"><div class="cy" lang="cy">${esc(r.text)}</div>
      <div class="meta"><span class="tag">${KIND[r.kind]}</span>L${r.unit} · ${esc(r.where)} · ${r.voice==='cyen-gwryw-gogledd'?'muž, sever':'žena, jih'}</div></div>
    <button class="flagbtn">${f?'Nahlášeno':'Nahlásit'}</button>
    ${f?`<div class="note"><input id="n-${r.key}" placeholder="Co je špatně? (např. slovo hen zní divně)" value="${esc(f.note||'')}"></div>`:''}
  </li>`;
}
function render(){
  if(!auto){ player.pause(); cur=-1 }
  view=filter();
  $('list').innerHTML=view.length?view.map(rowHTML).join(''):'<li class="empty">Žádné nahrávky neodpovídají filtru.</li>';
  stat();
}
function stat(){
  const all=filter(), h=ROWS.filter(r=>(!+$('unit').value||r.unit===+$('unit').value)).filter(r=>heard.has(r.key)).length;
  const n=Object.keys(flags).length;
  $('stat').textContent=`${view.length} v seznamu · poslechnuto v lekci ${h} · nahlášeno celkem ${n}`;
}

$('list').addEventListener('click',e=>{
  const li=e.target.closest('li.clip'); if(!li)return; const i=+li.dataset.i;
  if(e.target.closest('.play')){ auto=false; play(i) }
  else if(e.target.closest('.flagbtn')) toggleFlag(view[i]);
});
$('list').addEventListener('change',e=>{
  if(e.target.matches('.note input')){ const k=e.target.id.slice(2); saveNote(k,e.target.value) }
});
$('auto').onclick=()=>{ auto=true; play(cur>=0?cur:0) };
$('stop').onclick=()=>{ auto=false; player.pause(); setNow(-1) };
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{
  kindF=b.dataset.k; document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b)); render() });
['unit','onlyFlag','hideHeard'].forEach(id=>$(id).onchange=render);
let qt; $('q').oninput=()=>{clearTimeout(qt);qt=setTimeout(render,200)};

// flags live in the shared store so Claude can read them
async function toggleFlag(r){
  if(!db){ say('Nahlašování teď nefunguje: stránka nemá přístup k úložišti. Zkus ji otevřít přihlášený v claude.ai.'); return }
  const ref=db.doc('flags/'+r.key);
  try{
    if(flags[r.key]){ await ref.delete() }
    else { await ref.set({key:r.key,text:r.text,unit:r.unit,where:r.where,kind:r.kind,voice:r.voice,note:'',at:Date.now()}) }
  }catch(e){ say('Uložení se nepovedlo: '+(e.message||e.code)) }
}
async function saveNote(k,note){
  if(!db||!flags[k])return;
  try{ await db.doc('flags/'+k).update({note}); say('Poznámka uložena.'); setTimeout(()=>say(''),1500) }
  catch(e){ say('Poznámku se nepodařilo uložit: '+(e.message||e.code)) }
}
render();
(async()=>{
  db=await claude.use('db');
  if(!db){ say('Nahlašování je vypnuté (bez přístupu k úložišti). Přehrávat jde i tak.'); return }
  db.collection('flags').onSnapshot(s=>{
    const nf={}; s.docs.forEach(d=>{const v=d.data(); nf[v.key||d.id]=v});
    const focused=document.activeElement&&document.activeElement.matches('.note input');
    flags=nf; if(!focused){ const keepCur=cur, a=auto; auto=true; render(); auto=a; if(keepCur>=0){cur=keepCur;const li=$('list').children[cur];li&&li.classList.add('now')} } else stat();
  },err=>say('Úložiště nahlášených nahrávek neodpovídá.'));
})();
</script>
